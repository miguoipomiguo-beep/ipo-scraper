name: IPO Scraper

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-24.04   # ubuntu-latest が 26.04 になり playwright install-deps が失敗した（2026-11-01〜）
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scrape_ipos.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in ipo_data.json enrichment_cache.json s1_analysis_cache.json s1_batch_state.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Update IPO data $(date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
